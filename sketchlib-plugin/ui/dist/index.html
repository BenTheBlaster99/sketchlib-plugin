<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SketchLib</title>
    <script>
      // Make crashes visible instead of a blank white panel.
      window.addEventListener('error', function (e) {
        var box = document.getElementById('boot-error')
        if (box) {
          box.style.display = 'block'
          box.textContent = 'JS error: ' + (e.message || e) +
            (e.filename ? ('\n' + e.filename + ':' + e.lineno) : '')
        }
      })
      window.addEventListener('unhandledrejection', function (e) {
        var box = document.getElementById('boot-error')
        if (box) {
          box.style.display = 'block'
          box.textContent = 'Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)
        }
      })
      setTimeout(function () {
        var s = document.getElementById('boot-status')
        if (!s) return
        s.style.color = '#b91c1c'
        s.textContent =
          'App did not start. Re-copy ui/dist/index.html (~150 KB) and restart SketchUp.'
      }, 6000)
    </script>
      <style>*{box-sizing:border-box}html,body,#root{margin:0;height:100%;background:#fafafa;color:#111}button:disabled{opacity:.55;cursor:not-allowed}
